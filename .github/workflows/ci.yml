name: Verify Agent Skill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills/prelaunch-security-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Compile source
        run: python -m compileall -q scripts mcp_adapter tests
      - name: Run offline unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Schema and evaluation JSON syntax
        run: |
          python -m json.tool assets/findings.example.json > /dev/null
          python -m json.tool assets/findings.schema.json > /dev/null
          python -m json.tool ../../evals/cases.json > /dev/null
          python -m json.tool policy/action-policy.json > /dev/null
  mcp-stdio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: skills/prelaunch-security-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install exact MCP SDK for ephemeral integration test
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: 'mcp==2.1.0'
      - name: Test local stdio against disposable fixture
        run: |
          python -m unittest discover -s tests -p 'test_mcp_integration.py' -v
